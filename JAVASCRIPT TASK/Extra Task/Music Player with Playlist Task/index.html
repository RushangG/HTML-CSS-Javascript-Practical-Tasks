<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Music Player with Playlist</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Music Player</h1>
    </header>

    <main>
        <div class="main-box">

            <div class="left-side">
                <div class="box box-player">
                    <h3 id="song-title">No Song Playing</h3>
                    <img id="song-image" class="cover-image"
                        src="" alt="Not Found">
                    <p id="song-artist">Artist Name</p>

                    <audio id="my-audio" controls>
                        <source src="" type="audio/mpeg">
                    </audio>

                    <div class="control-buttons">
                        <button id="prev-button" title="Previous" ><i class="fa fa-step-backward"></i></button> 
                        <button id="play-pause-button" title="Play-Pause"><i class="fa fa-play"></i></button>                     
                        <button id="next-button" title="Next"><i class="fa fa-step-forward"></i></button>
                        <button id="stop-button" title="Stop"><i class="fa fa-stop"></i> Stop </button> 
                        <button id="shuffle-button" title="Shuffle"><i class="fa fa-random"></i> Shuffle </button>
                    </div>
                </div>
            </div>

            <div class="right-side box">

                <div class="box">
                    <h3>Add Music</h3>
                    <label for="add-title">Song Title</label>
                    <input type="text" id="add-title" class="form-input" placeholder="Song Title">
                    <label for="add-artist">Artist Name</label>
                    <input type="text" id="add-artist" class="form-input" placeholder="Artist Name">
                    <label for="add-url">Audio URL(.mp3)</label>
                    <input type="text" id="add-url" class="form-input" placeholder="Audio URL (.mp3)">
                    <label for="add-image">Image URL</label>
                    <input type="text" id="add-image" class="form-input" placeholder="Image URL">
                    <button id="add-song-button">Add Song</button>
     
                </div>
             
                <div class="box">
                    <form action="" id="file-upload-form" >
                    <h3>File Upload</h3>
                    <label for="file-input">Select Audio File</label>
                    <input type="file" id="file-input" class="form-input" accept=".mp3,.wav,.ogg" required>
                    <button id="upload-button">Upload</button>
                    </form>
                </div>


                <h3>My Playlist</h3>
                <ul id="playlistView"></ul>

            </div>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <script src="script.js"></script>
    
</body>

</html>
